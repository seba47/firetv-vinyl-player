<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vinilo · en la pared</title>
<!--
  Prueba los fondos de estufa.html montados sobre una foto de la tele en su lugar.
  La foto va en design/mockup/local/pared.jpg (no se sube al repo: es de tu casa).
  Si tu foto es otra, ajustá SCREEN abajo: el rectángulo de la pantalla en % de la foto.
-->
<style>
  :root { color-scheme: dark; --bg: #0e0b09; --fg: #eee3cf; --muted: rgb(238 227 207 / .55); --accent: #c2924f; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--fg); font: 14px/1.4 "Helvetica Neue", Arial, sans-serif;
    display: flex; gap: 24px; padding: 20px; align-items: flex-start; justify-content: center; }
  #photo { position: relative; height: calc(100vh - 40px); aspect-ratio: 1512 / 2016; flex: none; overflow: hidden; border-radius: 6px; }
  #photo img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #screen { position: absolute; overflow: hidden; }
  #screen iframe { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; border: 0; transform-origin: 0 0; }
  /* que parezca foto: un poco menos de contraste y el brillo de una pantalla real */
  #screen::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: rgb(255 255 255 / .03); box-shadow: inset 0 0 30px rgb(0 0 0 / .35); }
  aside { width: 260px; display: grid; gap: 18px; padding-top: 6px; }
  h1 { font-size: 18px; font-weight: 500; }
  .note { color: var(--muted); }
  .opts { display: grid; gap: 8px; }
  .opts button { text-align: left; padding: 10px 12px; border-radius: 8px; border: 1px solid rgb(238 227 207 / .15); background: none; color: var(--fg); font: inherit; cursor: pointer; }
  .opts button[aria-pressed="true"] { border-color: var(--accent); background: rgb(194 146 79 / .14); }
  label { display: grid; gap: 6px; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  @media (max-width: 760px) { body { flex-direction: column; align-items: center; } #photo { height: auto; width: 100%; } aside { width: 100%; } }
</style>
</head>
<body>
  <div id="photo">
    <img src="local/pared.jpg" alt="La tele colgada en la estufa">
    <div id="screen"><iframe id="tv" src="estufa.html#colgado" title="Tele"></iframe></div>
  </div>
  <aside>
    <h1>Fondo de la tele</h1>
    <div class="opts" id="opts">
      <button data-mode="actual">Actual (living oscuro)</button>
      <button data-mode="embudo">Embudo: centro oscuro, costados de yeso</button>
      <button data-mode="yeso">Todo yeso</button>
      <button data-mode="columna">Columna de yeso al centro</button>
      <button data-mode="colgado">Todo yeso, tocadiscos colgado</button>
    </div>
    <label for="lum">Brillo del yeso <span id="lumv"></span>
      <input id="lum" type="range" min="45" max="95" value="78">
    </label>
    <p class="note">Una pantalla brilla más que la pared: el yeso va un poco más apagado que el real para que de noche no encandile. Hacé click en la tele y usá → para pasar de tema.</p>
  </aside>
<script>
  // Rectángulo de la pantalla dentro de la foto, en % (medido sobre la foto de frente).
  const SCREEN = { left: 8.13, top: 29.9, width: 88.3, height: 37.35 };
  const photo = document.getElementById("photo"), screen = document.getElementById("screen"), tv = document.getElementById("tv");
  function fit() {
    Object.assign(screen.style, { left: SCREEN.left + "%", top: SCREEN.top + "%", width: SCREEN.width + "%", height: SCREEN.height + "%" });
    const w = photo.clientWidth * SCREEN.width / 100, h = photo.clientHeight * SCREEN.height / 100;
    tv.style.transform = `scale(${w / 1920}, ${h / 1080})`;
  }
  addEventListener("resize", fit); fit();

  let mode = "colgado";
  const lum = document.getElementById("lum");
  function apply() {
    document.querySelectorAll("#opts button").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === mode));
    document.getElementById("lumv").textContent = lum.value + "%";
    try { tv.contentWindow.setMode && tv.contentWindow.setMode(mode, +lum.value); } catch (_) {}
  }
  document.getElementById("opts").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { mode = b.dataset.mode; apply(); } });
  lum.addEventListener("input", apply);
  tv.addEventListener("load", apply);
  apply();
</script>
</body>
</html>
