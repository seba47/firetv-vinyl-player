[versions]
agp = "9.4.1"
kotlin = "2.4.21"
# NewPipeExtractor: cuando YouTube rompe algo, subir esta versión (tag de
# https://github.com/TeamNewPipe/NewPipeExtractor/releases, o un hash de commit
# de su rama dev si el arreglo todavía no salió en un release) y correr
# scripts/update.sh. Ver docs/actualizar-extractor.md.
newpipe-extractor = "v0.26.5"
okhttp = "5.5.0"
desugar = "2.1.5"
media3 = "1.11.1"
compose-bom = "2026.09.00"
activity-compose = "1.13.0"
junit = "4.13.2"
coil = "3.6.2"
zxing = "3.5.3"
nanohttpd = "2.3.1"
lifecycle = "2.10.0"

[libraries]
newpipe-extractor = { module = "com.github.TeamNewPipe:NewPipeExtractor", version.ref = "newpipe-extractor" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
android-desugar = { module = "com.android.tools:desugar_jdk_libs_nio", version.ref = "desugar" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
nanohttpd = { module = "org.nanohttpd:nanohttpd", version.ref = "nanohttpd" }
lifecycle-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-ui = { module = "androidx.compose.ui:ui" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
